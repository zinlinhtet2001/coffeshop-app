name: Node.js CI

on:
  push:
    branches:
      - uat
  pull_request:
    branches:
      - uat

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
      
      - name: Install Dependencies
        run: npm install 

      - name: Run Test
        run: npm test
